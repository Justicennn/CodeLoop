[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeloop"
version = "0.1.0"
description = "A small, self-built local coding-agent runtime."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0,<3",
    "rich>=14,<16",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
codeloop = "codeloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
